name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test matrix (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt','**/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f pyproject.toml ]; then
            python -m pip install poetry
            # Install into the runner environment (no virtualenv)
            poetry config virtualenvs.create false
            poetry install --no-interaction --no-ansi
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No pyproject.toml or requirements.txt found; continuing without installing project deps."
          fi
          # Ensure test/lint tools are available (harmless if already installed by project)
          pip install pytest pytest-cov flake8 black mypy

      - name: Lint (flake8)
        run: |
          if command -v flake8 >/dev/null 2>&1; then
            flake8 .
          else
            echo "flake8 not available, skipping"
          fi

      - name: Format check (black)
        run: |
          if command -v black >/dev/null 2>&1; then
            black --check .
          else
            echo "black not available, skipping"
          fi

      - name: Type check (mypy)
        run: |
          if command -v mypy >/dev/null 2>&1; then
            mypy .
          else
            echo "mypy not available, skipping"
          fi

      - name: Run tests (pytest + coverage)
        run: |
          mkdir -p test-reports
          pytest -q --maxfail=1 --junitxml=test-reports/junit-${{ matrix.python-version }}.xml --cov=./ --cov-report=xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: test-reports/

      - name: Upload coverage report (coverage.xml)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: (Optional) Send coverage to Codecov
        if: secrets.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
